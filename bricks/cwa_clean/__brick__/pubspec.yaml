name: {{project_name}}
description: "{{description}}"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  go_router_builder: ^2.8.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
{{#with_i18n}}  slang: ^4.5.0
  slang_flutter: ^4.5.0{{/with_i18n}}
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.3
  logger: ^2.5.0
  sentry_flutter: ^8.13.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  file_picker: ^9.0.2
  path_provider: ^2.1.5
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.1.2
  toastification: ^2.3.0
  flutter_cache_manager: ^3.4.1
  device_info_plus: ^11.3.3
  share_plus: ^10.1.4
  in_app_review: ^2.0.10
{{#with_drift}}  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0{{/with_drift}}
{{#with_backend}}{{#backend_is_firebase}}  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  firebase_remote_config: ^5.4.2
  firebase_app_installations: ^0.3.2{{/backend_is_firebase}}{{#backend_is_supabase}}  supabase_flutter: ^2.5.0{{/backend_is_supabase}}{{#backend_is_rest}}  dio: ^5.8.0+1{{/backend_is_rest}}{{/with_backend}}

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.4.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  lint: ^2.8.0
{{#with_i18n}}  slang_build_runner: ^4.5.0{{/with_i18n}}
{{#with_drift}}  drift_dev: ^2.20.0{{/with_drift}}

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/config/
